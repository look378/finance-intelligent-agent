# Docker Compose for 金融智能客服 Development

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: finance-agent-db
    environment:
      POSTGRES_DB: finance_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Redis (caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: finance-agent-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: finance-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - rag-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.26.0-community
    container_name: finance-agent-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # 金融智能客服 API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-agent-api
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finance_agent

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Qdrant
      VECTOR_DB_URL: http://qdrant:6333
      VECTOR_COLLECTION_NAME: documents

      # LLM API
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

      # Embedding Models
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3-v2-zh}
      EMBEDDING_CACHE_TTL: ${EMBEDDING_CACHE_TTL:-604800}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: neo4j
      GRAPH_RAG_ENABLED: ${GRAPH_RAG_ENABLED:-true}
      GRAPH_RAG_COMMUNITY_ENABLED: ${GRAPH_RAG_COMMUNITY_ENABLED:-true}

      # Security
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'

      # Logging
      LOG_LEVEL: INFO
    volumes:
      - ./app:/home/appuser/app/app
    user: root
    entrypoint: ["/bin/bash", "-c", "source /opt/venv/bin/activate && pip install -q PyJWT neo4j && exec /home/appuser/app/scripts/entrypoint.sh"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network
    restart: unless-stopped

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: finance-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rag-network
    profiles:
      - monitoring

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: finance-agent-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - rag-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  rag-network:
    driver: bridge
