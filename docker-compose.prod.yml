# 生产 Docker Compose 配置（金融智能客服）
# 部署：docker compose -f docker-compose.prod.yml up -d
#
# 前置准备：
#   1. 服务器上放置 .env.production（含 DEEPSEEK_API_KEY / SECRET_KEY / POSTGRES_PASSWORD 等）
#   2. 放置本地 embedding 模型到 ./models/bge-m3（或在服务器执行 scripts/init_kb.py 自动准备）
#   3. 首次启动后执行知识库初始化：docker compose -f docker-compose.prod.yml exec app python scripts/init_kb.py

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-agent:latest
    container_name: finance-agent-api
    ports:
      - "8000:8000"
    environment:
      # 应用
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必填，至少32字符}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}

      # 数据库
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/finance_agent
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0

      # Qdrant 向量库
      VECTOR_DB_URL: http://qdrant:6333
      VECTOR_COLLECTION_NAME: documents

      # LLM：DeepSeek（默认）→ OpenAI → Anthropic
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # 本地 Embedding（BGE-M3，模型目录挂载为卷）
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: bge-m3-v2-zh
      EMBEDDING_DEVICE: cpu

      # 记忆策略
      MEMORY_TYPE: optimized
      MEMORY_MAX_RECENT: 3
      MEMORY_MAX_RELEVANT: 5
      MEMORY_RELEVANCE_THRESHOLD: 0.5
      MEMORY_TOKEN_BUDGET: 4096

      # 金融合规护栏
      GUARDRAILS_ENABLED: "true"
      GUARDRAILS_INPUT_ENABLED: "true"
      GUARDRAILS_OUTPUT_ENABLED: "true"
      GUARDRAILS_PII_REDACTION_ENABLED: "true"
      PII_MASK_STYLE: full
      COMPLIANCE_CHECK_ENABLED: "true"
      RISK_DISCLAIMER_ENABLED: "true"

      # 审计日志
      AUDIT_LOG_ENABLED: "true"

      # 限流
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}

      # 服务健康检查依赖
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # 本地 embedding 模型（2.3GB，不进镜像，以卷挂载）
      - ./models:/home/appuser/app/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: finance-agent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: finance_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finance-agent-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispass}
      --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # 与 qdrant-client 1.19 匹配（旧版 1.7 存储格式不兼容）
    image: qdrant/qdrant:v1.19.0
    container_name: finance-agent-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  # Nginx 反向代理（可选：对外 80/443，配 HTTPS）
  nginx:
    image: nginx:alpine
    container_name: finance-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - rag-network
    profiles: ["web"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  rag-network:
    driver: bridge
