# Full-Stack Docker Compose for 金融智能客服
# Includes: Frontend (Next.js), Backend (FastAPI), PostgreSQL, Redis, Qdrant
# Deploy with: docker-compose -f docker-compose.fullstack.yml up -d
version: '3.8'

services:
  # ==========================================
  # FRONTEND (Next.js Portfolio)
  # ==========================================
  frontend:
    build:
      context: /Users/luopeng/Documents/GitHub/portfolio-fe
      dockerfile: Dockerfile
    image: portfolio-fe:latest
    container_name: portfolio-frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - rag-network

  # ==========================================
  # BACKEND API (FastAPI)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-agent:latest
    container_name: finance-agent-api
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-your_secure_password}@db:5432/finance_agent
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=20

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0

      # Vector DB
      - VECTOR_DB_URL=http://qdrant:6333
      - VECTOR_COLLECTION_NAME=documents

      # LLM Configuration
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_MODEL=${GLM_MODEL:-glm-5.2}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3-v2-zh}

      # Memory Configuration
      - MEMORY_TYPE=${MEMORY_TYPE:-optimized}
      - MEMORY_MAX_RECENT=${MEMORY_MAX_RECENT:-3}
      - MEMORY_MAX_RELEVANT=${MEMORY_MAX_RELEVANT:-5}
      - MEMORY_RELEVANCE_THRESHOLD=${MEMORY_RELEVANCE_THRESHOLD:-0.5}
      - MEMORY_TOKEN_BUDGET=${MEMORY_TOKEN_BUDGET:-4096}

      # Application Settings
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://101.43.97.91:3000}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Service dependencies (for health checks)
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: finance-agent-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-finance_agent}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=200
      -c work_mem=4MB
      -c maintenance_work_mem=64MB

  # ==========================================
  # REDIS CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: finance-agent-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-your_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # QDRANT VECTOR DATABASE
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  # ==========================================
  # NGINX REVERSE PROXY (Optional)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: finance-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - ./deployment/nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - app
    restart: unless-stopped
    networks:
      - rag-network
    profiles:
      - with-nginx  # Only start with: docker-compose --profile with-nginx up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  rag-network:
    driver: bridge
